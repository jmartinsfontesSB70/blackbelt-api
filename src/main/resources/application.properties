spring.application.name=blackbelt-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
blackbelt.jwt.secret=${JWT_SECRET}
blackbelt.jwt.expiration=3600000

blackbelt.licenca.chave-emissao=${SUA_CHAVE_SECRETA_LOCAL}

# Resend
resend.api-key=${RESEND_API_KEY}

# Armazenamento de fotos
blackbelt.storage.fotos-diretorio=${BLACKBELT_FOTOS_DIR}

# Upload de fotos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuração local
spring.config.import=optional:file:./application-local.properties